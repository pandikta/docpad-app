services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: docpad_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    networks:
      - docpad_network
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: docpad_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - docpad_network
    depends_on:
      - app

  db:
    image: mariadb:11.4
    container_name: docpad_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-dbsf_docpad}
      MYSQL_USER: ${DB_USERNAME:-docpad_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in root .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docpad_network

networks:
  docpad_network:
    driver: bridge

volumes:
  db_data:
